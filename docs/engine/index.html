<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>HIKARI 中枢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root {
  /* 貼り紙の作業台：紙の地、太い墨の縁、硬い影。星の黄 = いま・重点、杏 = あなたの確認待ち。左に目次、右に内容。 */
  --paper: #FAF8EE; --paper-2: #F2EFDF; --card: #FFFFFF; --ink: #17160F; --muted: #5E5B4B;
  --rule: #17160F; --shade: #17160F; --star: #F1F977; --apricot: #FFBC7B;
  --bad: #D8453D; --good: #3E8F5C; --soft: #D9D5C2;
  --display: "Dela Gothic One", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --body: "Noto Sans JP", "Noto Sans SC", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121109; --paper-2: #191811; --card: #1F1E16; --ink: #F3F1E4; --muted: #ADA993; --rule: #57533D; --shade: #000000; --bad: #F06A5E; --good: #6CC48D; --soft: #3A3828; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121109; --paper-2: #191811; --card: #1F1E16; --ink: #F3F1E4; --muted: #ADA993; --rule: #57533D; --shade: #000000; --bad: #F06A5E; --good: #6CC48D; --soft: #3A3828; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 20; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--apricot); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }
code { font-family: var(--mono); font-size: .86em; background: var(--paper-2); border: 1.5px solid var(--soft); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }

/* ---------- 上の帯 ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--paper); border-bottom: 2.5px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 17px; text-decoration: none; white-space: nowrap; min-width: 0; }
.brand img { width: 30px; height: 30px; object-fit: contain; transform: rotate(-6deg); }
.chip { font-size: 12px; font-weight: 700; border: 2px solid var(--rule); border-radius: 999px; padding: 0 9px; white-space: nowrap; background: var(--card); }
.chip.live { background: var(--star); color: #17160F; border-color: #17160F; }
.chip.warn { background: var(--apricot); color: #17160F; border-color: #17160F; }
.top .grow { flex: 1 1 140px; min-width: 0; }
.sites { display: flex; flex-wrap: wrap; gap: 4px; }
.sites a { font-size: 12px; font-weight: 700; border: 2px solid var(--soft); border-radius: 999px; padding: 0 9px; white-space: nowrap; text-decoration: none; }
.sites a:hover { border-color: var(--rule); background: var(--card); }
.sites a.on { background: var(--star); color: #17160F; border-color: #17160F; }
#q { width: 100%; max-width: 320px; border: 2px solid var(--rule); border-radius: 999px; background: var(--card); padding: 2px 12px; }

/* ---------- 骨組み ---------- */
.shell { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 18px; padding-block: 16px 40px; align-items: start; }
.shell.solo { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
#nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: flex; flex-direction: column; gap: 3px; }
#nav a { text-decoration: none; font-weight: 700; font-size: 14px; padding: 5px 10px; border-radius: 10px; border: 2px solid transparent; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
#nav a:hover { border-color: var(--rule); background: var(--card); }
#nav a.on { background: var(--star); color: #17160F; border-color: #17160F; box-shadow: 3px 3px 0 var(--shade); }
.badge { font-size: 11px; font-weight: 900; line-height: 1.6; background: var(--apricot); color: #17160F; border: 2px solid #17160F; border-radius: 999px; padding: 0 6px; }
main { min-width: 0; display: grid; gap: 16px; }

h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
h3 { font-size: 16px; margin: 0 0 4px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
.card { background: var(--card); border: 2.5px solid var(--rule); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.card.now { box-shadow: 4px 4px 0 var(--shade); border-color: #17160F; background: linear-gradient(var(--star), var(--star)) left top / 8px 100% no-repeat, var(--card); padding-left: 20px; }
.card.wait { box-shadow: 4px 4px 0 var(--shade); border-color: #17160F; background: linear-gradient(var(--apricot), var(--apricot)) left top / 8px 100% no-repeat, var(--card); padding-left: 20px; }
.note { padding: 10px 14px; border-left: 6px solid var(--apricot); background: var(--paper-2); border-radius: 0 12px 12px 0; }
.empty { color: var(--muted); font-size: 14px; margin: 2px 0; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 7px 0; border-top: 2px solid var(--paper-2); text-decoration: none; }
.row:first-of-type { border-top: 0; }
a.row:hover b { text-decoration: underline; }
.row b { font-weight: 700; overflow-wrap: anywhere; }
.row small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.row .side { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.when { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.st { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.5; border: 2px solid var(--rule); border-radius: 999px; padding: 0 8px; white-space: nowrap; background: var(--card); }
.st.open { background: var(--star); color: #17160F; border-color: #17160F; }
.st.wait { background: var(--apricot); color: #17160F; border-color: #17160F; }
.st.closed { background: var(--paper-2); color: var(--muted); }
.st.bad { background: var(--bad); color: #fff; border-color: #17160F; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border: 1.5px solid var(--soft); border-radius: 6px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.meter { height: 9px; border: 2px solid var(--rule); border-radius: 999px; background: var(--paper-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--star); }

.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; line-height: 1.3; padding: 5px 12px; border: 2px solid #17160F; border-radius: 10px; background: var(--apricot); color: #17160F; box-shadow: 2px 2px 0 #17160F; cursor: pointer; }
.btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #17160F; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--rule); box-shadow: none; }
.btn.star { background: var(--star); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.mini { font-size: 12px; padding: 1px 8px; border-radius: 8px; box-shadow: none; }
.btn[disabled] { opacity: .5; cursor: default; }

/* ---------- ボード ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--paper-2); border: 2px solid var(--soft); border-radius: 12px; padding: 8px; min-width: 0; }
.col h2 { margin: 2px 4px 8px; }
.kc { display: block; background: var(--card); border: 2px solid var(--rule); border-radius: 10px; padding: 7px 9px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; text-decoration: none; }
.kc.now { border-color: #17160F; box-shadow: 3px 3px 0 var(--shade); background: linear-gradient(var(--star), var(--star)) left top / 6px 100% no-repeat, var(--card); padding-left: 14px; }
.kc b { display: block; overflow-wrap: anywhere; }
.kc .acts { margin-top: 5px; }

/* ---------- 詳細 ---------- */
.kv { display: grid; grid-template-columns: minmax(84px, auto) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; font-size: 13px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv ul, .kv ol { margin: 0; padding-left: 1.2em; }
.md { min-width: 0; overflow-wrap: anywhere; }
.md p { margin: 0 0 8px; }
.md h3, .md h4, .md h5 { margin: 12px 0 4px; font-size: 15px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 1.3em; }
.md li + li { margin-top: 2px; }
.md pre { margin: 0 0 8px; background: var(--paper-2); border: 2px solid var(--soft); border-radius: 10px; padding: 8px 10px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
.md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.md .tw { overflow-x: auto; margin: 0 0 8px; }
.md table { border-collapse: collapse; font-size: 13.5px; }
.md th, .md td { border: 1.5px solid var(--soft); padding: 4px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--paper-2); }
.md > :last-child { margin-bottom: 0; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs img { cursor: zoom-in; min-width: 60px; min-height: 40px; background: var(--paper-2); }
.imgs img, .imgs video { max-width: min(100%, 320px); max-height: 240px; border: 2px solid var(--rule); border-radius: 8px; }
.opt { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; padding: 8px 10px; border: 2px solid var(--rule); border-radius: 10px; margin-top: 6px; }
.opt.rec { background: var(--apricot); color: #17160F; border-color: #17160F; }
.opt.chosen { background: var(--star); color: #17160F; border-color: #17160F; }
.opt span { flex: 1 1 200px; min-width: 0; }
.ans { border-top: 2px dashed var(--soft); padding-top: 8px; margin-top: 8px; }

/* ---------- 入力 ---------- */
dialog { width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); border: 2.5px solid #17160F; border-radius: 16px; box-shadow: 7px 7px 0 var(--shade); background: var(--card); color: var(--ink); padding: 0; }
dialog::backdrop { background: rgba(18, 17, 9, .55); }
#dlg-form { display: grid; gap: 12px; padding: 16px 18px; }
.f { display: grid; gap: 3px; }
.f label { font-weight: 700; font-size: 13px; }
.f small { color: var(--muted); font-size: 12px; }
.f input[type="text"], .f input[type="number"], .f select, .f textarea { width: 100%; border: 2px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 5px 10px; }
.f textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
.f textarea.tall { min-height: 220px; font-family: var(--mono); font-size: 13px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.checks label { font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.dlg-foot .left { margin-right: auto; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 6px 14px; font-weight: 700; font-size: 13px; max-width: calc(100vw - 32px); }
#toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 10px; padding-block: 10px 32px; }
  #nav { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  #nav::-webkit-scrollbar { display: none; }
  #nav a { white-space: nowrap; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
}

/* ---------- 整理：筛选条、分组、时间线 ---------- */
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: var(--paper-2); border: 2px solid var(--soft); border-radius: 12px; }
.bar .seg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.bar .bl { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.pick { font-size: 12px; font-weight: 700; line-height: 1.6; border: 2px solid var(--soft); border-radius: 999px; padding: 0 9px; background: var(--card); cursor: pointer; white-space: nowrap; }
.pick.on { background: var(--star); color: #17160F; border-color: #17160F; }
.bar select { font-size: 12px; font-weight: 700; border: 2px solid var(--soft); border-radius: 999px; background: var(--card); padding: 1px 8px; }
details.grp { min-width: 0; }
details.grp > summary { cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); padding: 4px 2px; display: flex; gap: 8px; align-items: center; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: "▸"; display: inline-block; transition: transform .12s; }
details.grp[open] > summary::before { transform: rotate(90deg); }
.navt { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 2px; }
.capture { display: flex; gap: 8px; }
.capture input { flex: 1 1 auto; min-width: 0; border: 2.5px solid var(--rule); border-radius: 12px; background: var(--card); padding: 7px 12px; }
.day { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
.day > h2 { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); margin: 0; padding-top: 10px; flex-direction: column; align-items: flex-start; gap: 0; }
.day > h2 b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--ink); letter-spacing: 0; }
.ev .tag { margin-right: 4px; }
.board.b5 { grid-template-columns: repeat(5, minmax(200px, 1fr)); }
@media (max-width: 820px) { .day { grid-template-columns: minmax(0, 1fr); } .day > h2 { position: static; flex-direction: row; gap: 8px; align-items: baseline; } .navt { display: none; } }
/* 中文页面：大标题用中文黑体，免得日文展示字体缺简体字时一行里混两种字形。 */
:root { --display: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
h1, .brand, .day > h2 b { font-weight: 900; }

</style>

<script type="module">
// Firebase（Google 登录与 Firestore）包成页面用的小窗口。update 会合并嵌套的表（merge）。
// 本地缓存开着：重新打开页面时只重读变过的记录，省免费额度。
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, setDoc, deleteDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app = initializeApp(JSON.parse(document.getElementById("hub-config").textContent).firebase);
const auth = getAuth(app);
const store = initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const snapOf = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
const docRef = (path) => {
  const ref = doc(store, path);
  return { get: async () => snapOf(await getDoc(ref)), set: (d) => setDoc(ref, d), update: (d) => setDoc(ref, d, { merge: true }), delete: () => deleteDoc(ref),
    onSnapshot: (next, fail) => onSnapshot(ref, (s) => next(snapOf(s)), fail) };
};
const collRef = (path, cons = []) => ({
  orderBy: (field, dir) => collRef(path, [...cons, orderBy(field, dir)]), limit: (n) => collRef(path, [...cons, limit(n)]),
  onSnapshot: (next, fail) => onSnapshot(query(collection(store, path), ...cons), (s) => next({ docs: s.docs.map(snapOf), metadata: s.metadata }), fail),
});
window.hubBackend = {
  db: { doc: docRef, collection: collRef },
  onAuth: (cb) => onAuthStateChanged(auth, (u) => cb(u && { uid: u.uid, email: u.email, name: u.displayName })),
  signIn: () => signInWithPopup(auth, new GoogleAuthProvider()),
  signOut: () => signOut(auth),
  // 智能体的钥匙：更新本人登录用的令牌。hq 命令凭它以本人的身份读写。
  key: () => "hhk1." + auth.currentUser.refreshToken,
};
window.dispatchEvent(new Event("hub-backend"));
</script>

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const blank = (v) => v == null || v === "" || (Array.isArray(v) && !v.length) || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length);

const pad = (n) => String(n).padStart(2, "0");

const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localDay = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : dayKey(d); };
function fmt(iso) {
  const d = new Date(iso);
  return !iso || isNaN(d) ? "" : `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const docDate = (coll, d) => d[COLL[coll].date] || d.updated_at || d.at || "";
const byText = (d) => esc(d.by || "") + (d.by_agent ? ` · ${esc(d.by_agent)}` : "");
function newId(prefix) {
  const a = new Uint8Array(3);

  return prefix + "-" + [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
}
// 日期分组：今天、昨天、本周、上周，再往前按月（按月的默认折叠）。
function dateBucket(iso) {
  const day = localDay(iso);
  if (!day) return { key: "0", label: "没有日期", fold: true };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(day + "T00:00:00")) / 86400000);
  const weekStart = (today.getDay() + 6) % 7;
  if (diff <= 0) return { key: "9" + day, label: "今天" };
  if (diff === 1) return { key: "8", label: "昨天" };
  if (diff <= weekStart) return { key: "7", label: "本周" };
  if (diff <= weekStart + 7) return { key: "6", label: "上周" };
  return { key: "5" + day.slice(0, 7), label: `${day.slice(0, 4)} 年 ${Number(day.slice(5, 7))} 月`, fold: true };
}
const weekday = (day) => "周" + "日一二三四五六"[new Date(day + "T00:00:00").getDay()];

// ---------- Markdown（先全部转义，再只还原认得的写法） ----------
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const lines = String(text ?? "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flush();
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
    } else if (/^\|.*\|\s*$/.test(line)) {
      flush();
      const rows = [];
      for (; i < lines.length && /^\|.*\|\s*$/.test(lines[i]); i++) rows.push(lines[i].trim().slice(1, -1).split("|").map((c) => c.trim()));
      const head = rows.length > 1 && rows[1].every((c) => /^:?-+:?$/.test(c));
      const body = head ? rows.slice(2) : rows;
      out.push(`<div class="tw"><table>${head ? `<tr>${rows[0].map((c) => `<th>${inline(c)}</th>`).join("")}</tr>` : ""}${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);
    } else if (/^#{1,4}\s/.test(line)) {
      flush();
      const n = Math.min(5, line.match(/^#+/)[0].length + 2);
      out.push(`<h${n}>${inline(line.replace(/^#+\s*/, ""))}</h${n}>`);
      i++;
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+\./.test(line), items = [];
      for (; i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length)); i++) {
        if (/^\s{0,1}([-*]|\d+\.)\s+/.test(lines[i]) || !items.length) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else items[items.length - 1] += "\n" + lines[i].trim().replace(/^([-*]|\d+\.)\s+/, "・");
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((it) => `<li>${it.split("\n").map(inline).join("<br>")}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (!line.trim()) { flush(); i++; } else { para.push(line); i++; }
  }
  flush();
  return out.join("");
}

// ---------- 小部件 ----------
function stClass(coll, d) {
  if (needsYou(coll, d)) return "wait";
  return isOpen(coll, d) ? "open" : "closed";
}
const stPill = (coll, d) => (COLL[coll].states && d.state ? `<span class="st ${stClass(coll, d)}">${esc(d.state)}${d.state === "等你" && d.waiting ? "・" + esc(d.waiting) : ""}</span>` : "");
const tags = (d) => [d.kind, d.severity, ...(d.areas || [])].filter(Boolean).map((x) => `<span class="tag">${esc(x)}</span>`).join(" ");
// 已收工的工作记录里没写的必填项（空数组算写了“没有”）。
function gaps(coll, d) {
  const req = COLL[coll].required_when_done;
  if (!req || d.state !== "已收工") return [];
  return req.filter((k) => d[k] == null || (k === "conclusion" && !String(d[k]).trim()));
}
const gapPill = (coll, d) => { const n = gaps(coll, d).length; return n ? `<span class="st bad">缺 ${n} 项</span>` : ""; };
function row(coll, d, sub) {
  return `<a class="row" href="#${esc(d.id)}"><span><b>${esc(titleOf(d))}</b><small>${sub ?? `${byText(d)} ${tags(d)}`}</small></span><span class="side">${stPill(coll, d)}${gapPill(coll, d)}<span class="when">${esc(fmt(docDate(coll, d)))}</span></span></a>`;
}
const list = (rows, empty = "没有") => (rows.length ? rows.join("") : `<p class="empty">${empty}</p>`);
const btn = (act, label, data = {}, cls = "") => `<button type="button" class="btn ${cls}" data-act="${act}" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(label)}</button>`;
const pick = (label, on, data) => `<button type="button" class="pick ${on ? "on" : ""}" data-act="filt" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(label)}</button>`;
function toast(text, bad) {
  const el = $("#toast");
  el.textContent = text;
  el.className = bad ? "bad" : "";
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2600);
}
const matchQ = (d) => !S.q || JSON.stringify(d).toLowerCase().includes(S.q);

// ---------- 写入 ----------
function stamp(isNew) {
  const at = now();
  return isNew ? { by: who(), at, updated_at: at, updated_by: who() } : { updated_at: at, updated_by: who() };
}
async function write(coll, id, data, isNew) {
  if (!S.db) return false;
  try {
    const ref = S.db.doc(coll + "/" + id);
    if (isNew) await ref.set({ ...data, ...stamp(true) });
    else await ref.update({ ...data, ...stamp(false) });
    toast("已保存");
    return true;
  } catch (e) {
    toast(e && e.code === "permission-denied" ? "没有写入权限" : `保存失败（${(e && e.code) || "?"}）`, true);
    return false;
  }
}
async function writeSetting(name, next) {
  try { await S.db.doc("settings/" + name).set({ ...next, ...stamp(false) }); return true; } catch (e) { toast(`保存失败（${(e && e.code) || "?"}）`, true); return false; }
}

// ---------- 表单（各项从字段声明生成） ----------
function fieldInput(f, v) {
  const id = "f-" + f.key, help = f.help ? `<small>${esc(f.help)}</small>` : "";
  const label = `<label for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>`;
  const opts = (arr, cur, emptyOk = true) => (emptyOk ? `<option value=""></option>` : "") + arr.map((o) => `<option value="${esc(o.v ?? o)}" ${String(o.v ?? o) === String(cur ?? "") ? "selected" : ""}>${esc(o.l ?? o)}</option>`).join("");
  let input;
  switch (f.type) {
    case "longtext": input = `<textarea id="${id}" class="${f.key === "body" ? "tall" : ""}">${esc(v ?? "")}</textarea>`; break;
    case "list": case "refs": input = `<textarea id="${id}">${esc((v || []).join("\n"))}</textarea><small>${esc(f.help || "一行一个")}</small>`; break;
    case "options": input = `<textarea id="${id}">${esc((v || []).map((o) => (o.recommended ? "★ " : "") + o.text).join("\n"))}</textarea><small>一行一个，推荐项前面加 ★（恰好一个）</small>`; break;
    case "number": input = `<input type="number" step="any" id="${id}" value="${esc(v ?? "")}">`; break;
    case "bool": return `<div class="f"><label class="checks"><span><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(f.label)}</span></label>${help}</div>`;
    case "choice": input = `<select id="${id}">${opts(f.choices, v)}</select>`; break;
    case "state": input = `<select id="${id}">${opts(f.states, v, false)}</select>`; break;
    case "ref": input = `<select id="${id}">${opts(docs(f.to).filter((d) => isOpen(f.to, d) || d.id === v).map((d) => ({ v: d.id, l: titleOf(d) })), v)}</select>`; break;
    case "areas": input = `<div class="checks" id="${id}">${areas().map((a) => `<label><input type="checkbox" value="${esc(a)}" ${(v || []).includes(a) ? "checked" : ""}>${esc(a)}</label>`).join("")}</div>`; break;
    default: input = `<input type="text" id="${id}" value="${esc(v ?? "")}" autocomplete="off">`;
  }
  return `<div class="f">${label}${input}${["list", "refs", "options"].includes(f.type) ? "" : help}</div>`;
}
function fieldValue(f) {
  const el = $("#f-" + f.key);
  if (!el) return undefined;
  const lines = () => el.value.split("\n").map((s) => s.trim()).filter(Boolean);
  switch (f.type) {
    case "list": case "refs": return lines();
    case "options": return lines().map((s) => ({ text: s.replace(/^[★*]\s*/, ""), recommended: /^[★*]/.test(s) }));
    case "number": return el.value === "" ? null : Number(el.value);
    case "bool": return el.checked;
    case "areas": return [...el.querySelectorAll("input:checked")].map((i) => i.value);
    default: return el.value.trim();
  }
}
// defs：字段的数组。onSave(values) 返回 true 就关掉。
function openForm({ title, defs, values = {}, onSave, note = "", del }) {
  const form = $("#dlg-form");
  form.innerHTML = `<h1>${esc(title)}</h1>${note ? `<p class="muted">${esc(note)}</p>` : ""}${defs.map((f) => fieldInput(f, values[f.key])).join("")}
    <div class="dlg-foot">${del ? `<span class="left">${btn("del-ask", "删除", {}, "ghost mini")}</span>` : ""}${btn("close", "取消", {}, "ghost")}<button class="btn" type="submit">保存</button></div>`;
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const submit = form.querySelector('[type="submit"]');
    submit.disabled = true;
    try {
      const out = {};
      for (const f of defs) {
        const v = fieldValue(f);
        if (v === undefined) continue;
        if (f.required && blank(v)) { toast(`${f.label}：请填写`, true); return; }
        if (f.type === "options" && v.length && (v.length < 2 || v.filter((o) => o.recommended).length !== 1)) { toast("至少两个选项，★ 恰好一个", true); return; }
        out[f.key] = v;
      }
      if (await onSave(out)) $("#dlg").close();
    } catch (e) { toast(String((e && e.message) || "保存失败"), true); } finally { submit.disabled = false; }
  };
  openForm.del = del;
  $("#dlg").showModal();
}
const fieldsOf = (coll, keys) => keys.map((k) => COLL[coll].fields.find((f) => f.key === k)).filter(Boolean);
function editDefs(coll) {
  const skip = new Set(["time", "log", "answers"]);
  return COLL[coll].fields.filter((f) => !skip.has(f.type)).map((f) => (f.type === "state" ? { ...f, states: COLL[coll].states.map((s) => s.name) } : f));
}
function createDoc(coll, preset = {}, after) {
  const c = COLL[coll];
  openForm({
    title: `${c.label}：新建`, note: c.summary, defs: fieldsOf(coll, c.create), values: preset,
    onSave: async (v) => {
      const id = newId(c.prefix), base = c.states ? { state: c.states[0].name } : {};
      const ok = await write(coll, id, { ...base, ...preset.extra, ...v }, true);
      if (ok && after) await after(id);
      if (ok) location.hash = id;
      return ok;
    },
  });
}
function editDoc(coll, id) {
  const d = S.data[coll].get(id);
  if (!d) return;
  openForm({
    title: `${COLL[coll].label}：编辑`, defs: editDefs(coll), values: d, onSave: (v) => write(coll, id, v, false),
    del: async () => { try { await S.db.doc(coll + "/" + id).delete(); toast("已删除"); location.hash = coll === "cards" ? "board" : coll; return true; } catch { toast("删除失败", true); return false; } },
  });
}

// ---------- 整理：筛选与分组 ----------
function filt(coll) {
  return { area: "", state: "open", group: (COLL[coll] || {}).group || "date", ...S.f[coll] };
}
function setFilt(coll, k, v) {
  S.f[coll] = { ...S.f[coll], [k]: v };
  try { localStorage.setItem("hq-filters", JSON.stringify(S.f)); } catch { /* 存不了也照常用 */ }
}
function sorted(coll, rows) {
  if (COLL[coll].sort === "order") return rows.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
  return rows.sort((a, b) => String(docDate(coll, b)).localeCompare(String(docDate(coll, a))));
}
function applyFilt(coll, rows) {
  const c = COLL[coll], f = filt(coll);
  if (f.area) rows = rows.filter((d) => (d.areas || []).includes(f.area));
  if (c.states && f.state === "open") rows = rows.filter((d) => isOpen(coll, d));
  else if (c.states && f.state !== "all") rows = rows.filter((d) => d.state === f.state);
  return sorted(coll, rows.filter(matchQ));
}
// 返回 [{label, items, fold}]。按领域分组时，一条记录出现在它的每个领域下面。
function grouped(coll, rows, by) {
  const c = COLL[coll], f = filt(coll), out = new Map();
  const put = (key, label, d, fold) => { if (!out.has(key)) out.set(key, { key, label, items: [], fold }); out.get(key).items.push(d); };
  for (const d of rows) {
    if (by === "area") {
      const mine = blank(d.areas) ? ["未分类"] : d.areas.filter((a) => !f.area || a === f.area);
      for (const a of mine) put(String(areas().indexOf(a) + 1 || 999).padStart(3, "0") + a, a, d);
    } else if (by === "state" && c.states) {
      const i = c.states.findIndex((s) => s.name === d.state);
      put(String(i < 0 ? 99 : i).padStart(2, "0"), d.state || "—", d, i >= 0 && !c.states[i].open);
    } else if (by === "project") {
      put(d.project ? "0" + refTitle(d.project) : "1", d.project ? refTitle(d.project) : "没有项目", d);
    } else {
      const b = dateBucket(docDate(coll, d));
      put(b.key, b.label, d, b.fold);
    }
  }
  const all = [...out.values()];
  return by === "date" || !by ? all.sort((a, b) => b.key.localeCompare(a.key)) : all.sort((a, b) => a.key.localeCompare(b.key));
}
function groupModes(coll) {
  const c = COLL[coll], keys = c.fields.map((f) => f.key), modes = ["date"];
  if (keys.includes("areas")) modes.push("area");
  if (c.states) modes.push("state");
  if (keys.includes("project")) modes.push("project");
  return modes;
}
function filterBar(coll) {
  const c = COLL[coll], f = filt(coll), segs = [];
  segs.push(`<div class="seg"><span class="bl">分组</span>${groupModes(coll).map((m) => pick(GROUPS[m], f.group === m, { coll, k: "group", v: m })).join("")}</div>`);
  if (c.states) segs.push(`<div class="seg"><span class="bl">状态</span>${pick("没结束的", f.state === "open", { coll, k: "state", v: "open" })}${pick("全部", f.state === "all", { coll, k: "state", v: "all" })}${c.states.map((s) => pick(s.name, f.state === s.name, { coll, k: "state", v: s.name })).join("")}</div>`);
  if (c.fields.some((x) => x.key === "areas")) segs.push(`<div class="seg"><span class="bl">领域</span><select data-change="area" data-coll="${coll}"><option value="">全部领域</option>${areas().map((a) => `<option ${f.area === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></div>`);
  return `<div class="bar">${segs.join("")}</div>`;
}
const groupHtml = (g, body) => `<details class="grp" ${g.fold ? "" : "open"}><summary>${esc(g.label)} <span class="chip">${g.items.length}</span></summary>${body}</details>`;

// ---------- 页面 ----------
function renderNav(view) {

  $("#nav").innerHTML = SCHEMA.nav.map((sec) => (sec.title ? `<div class="navt">${esc(sec.title)}</div>` : "") + sec.views.map((key) => {
    const n = COLL[key] ? count(key) : key === "board" ? count("cards") : 0;
    return `<a href="#${key}" class="${key === view ? "on" : ""}">${esc(viewLabel(key))}${n ? `<span class="badge">${n}</span>` : ""}</a>`;
  }).join("")).join("");
}
const captureBox = () => (canWrite() ? `<form class="capture" data-form="idea"><input id="idea-in" type="text" autocomplete="off" placeholder="想到什么先记下来，回车保存" aria-label="记一个想法"><button class="btn star" type="submit">记下</button></form>` : "");
const queueCards = () => { const q = plan().queue; return docs("cards").filter((c) => c.state === "排队").sort((a, b) => ((q.indexOf(a.id) + 1) || 999) - ((q.indexOf(b.id) + 1) || 999)); };

function viewHome() {
  const cards = docs("cards"), sessions = docs("sessions");
  const focus = docs("projects").filter((p) => p.focus && p.state === "进行中").map((p) => {
    const mine = cards.filter((c) => c.project === p.id), done = mine.filter((c) => c.state === "完成").length, live = mine.filter((c) => c.state !== "不做").length;
    const cur = mine.filter((c) => c.state === "进行中").map((c) => row("cards", c, "正在做")), next = queueCards().filter((c) => c.project === p.id).slice(0, 3).map((c) => row("cards", c, "接下来"));
    return `<div class="row"><span><a href="#${esc(p.id)}"><b>${esc(p.title)}</b></a><small>${done} / ${live} 张卡完成</small><div class="meter"><i style="width:${live ? Math.round((done / live) * 100) : 0}%"></i></div></span><span class="side">${tags({ areas: p.areas })}</span></div>${cur.join("")}${next.join("")}`;
  });
  const working = sessions.filter((s) => s.state === "进行中").map((s) => { const last = (s.progress || []).slice(-1)[0]; return row("sessions", s, `${byText(s)}${last ? " — " + esc(last.note) : ""}`); });
  const waits = [

// 时间线：所有记录按天排，一天一段。新建算一件事；状态在别的日子变了再算一件。
function viewTimeline() {
  const f = filt("timeline"), events = [];
  for (const c of SCHEMA.collections) {
    if (c.key === "members" || (S.tlKind && S.tlKind !== c.key)) continue;
    for (const d of docs(c.key)) {
      if ((f.area && !(d.areas || []).includes(f.area)) || !matchQ(d)) continue;
      const start = d[c.date] || d.at, end = c.key === "sessions" ? d.ended_at : d.updated_at;
      if (start) events.push({ at: start, coll: c.key, d, what: c.key === "sessions" ? "开工" : "新建" });
      if (end && localDay(end) !== localDay(start) || (c.key === "sessions" && end)) events.push({ at: end, coll: c.key, d, what: c.key === "sessions" ? d.state : d.state || "更新" });
    }
  }
  const days = new Map();
  for (const e of events.sort((a, b) => String(b.at).localeCompare(String(a.at)))) {
    const day = localDay(e.at);
    if (!days.has(day)) days.set(day, []);
    days.get(day).push(e);
  }
  const shown = [...days].slice(0, S.days);
  const kinds = SCHEMA.collections.filter((c) => c.key !== "members");
  return `<div class="head"><h1>时间线</h1></div><p class="muted">每天做了什么、记了什么，按日期排。</p>
    <div class="bar"><div class="seg"><span class="bl">种类</span><select data-change="tl-kind"><option value="">全部</option>${kinds.map((c) => `<option value="${c.key}" ${S.tlKind === c.key ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></div>
      <div class="seg"><span class="bl">领域</span><select data-change="area" data-coll="timeline"><option value="">全部领域</option>${areas().map((a) => `<option ${f.area === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></div></div>
    ${shown.map(([day, evs]) => `<div class="day"><h2><b>${esc(day.slice(5))}</b><span>${weekday(day)} · ${evs.length} 件</span></h2><section class="card">${evs.map((e) => `<a class="row ev" href="#${esc(e.d.id)}"><span><b>${esc(titleOf(e.d))}</b><small><span class="tag">${esc(COLL[e.coll].label)}</span>${esc(e.what)} ${tags({ areas: e.d.areas })}</small></span><span class="side"><span class="when">${esc(fmt(e.at).slice(6))}</span></span></a>`).join("")}</section></div>`).join("") || `<p class="empty">没有</p>`}
    ${days.size > S.days ? `<p>${btn("more-days", "再看更早的 14 天", {}, "ghost")}</p>` : ""}`;
}

function fieldView(f, v, d) {
  const ref = (id) => `<a href="#${esc(id)}">${esc(refTitle(id))}</a>`;
  switch (f.type) {
    case "longtext": return `<div class="md">${md(v)}</div>`;
    case "list": return f.key === "steps"
      ? `<ol>${v.map((x, i) => `<li>${i < (d.done || 0) ? "<b>✓</b> " : ""}${inline(x)}</li>`).join("")}</ol>`
      : `<ul>${v.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`;
    case "refs": return `<ul>${v.map((x) => `<li>${ref(x)}</li>`).join("")}</ul>`;
    case "areas": return v.map((x) => `<span class="tag">${esc(x)}</span>`).join(" ");
    case "bool": return v ? "✓" : "";
    case "ref": return ref(v);
    case "log": return `<ul>${v.map((x) => `<li><span class="when">${esc(fmt(x.at))}</span> ${esc(x.note)}</li>`).join("")}</ul>`;
    case "time": return esc(fmt(v));
    case "options": {
      const can = d.state === "等你定" && canWrite();
      return v.map((o, i) => `<div class="opt ${d.state === "已定" && d.choice === o.text ? "chosen" : o.recommended && d.state === "等你定" ? "rec" : ""}"><span>${o.recommended ? "<b>推荐</b> " : ""}${inline(o.text)}</span>${can ? btn("decide", "选这个", { id: d.id, i }, "mini star") : ""}</div>`).join("");
    }
    case "answers": return Object.values(v).sort((a, b) => String(a.at).localeCompare(String(b.at))).map((a) => `<div class="ans"><small class="muted">${byText(a)} · ${esc(fmt(a.at))}</small><div class="md">${md(a.text)}</div></div>`).join("");
    default: return esc(v);
  }
}
// 指向这条记录的其他记录（任务卡的工作记录、项目的任务卡、想法拆出的卡……）。
function related(id) {
  const out = [];
  for (const c of SCHEMA.collections) {
    const refs = c.fields.filter((f) => f.type === "ref" || f.type === "refs");
    if (!refs.length) continue;
    const hits = sorted(c.key, docs(c.key).filter((d) => refs.some((f) => (f.type === "ref" ? d[f.key] === id : (d[f.key] || []).includes(id)))));
    if (hits.length) out.push(`<section class="card"><h2>${esc(c.label)} <span class="chip">${hits.length}</span></h2>${hits.slice(0, 30).map((d) => row(c.key, d)).join("")}</section>`);
  }
  return out.join("");
}

const viewLogin = () => `<div class="head"><h1>${esc(SCHEMA.name)}</h1></div><section class="card"><p>请用受邀的 Google 账号登录。</p><p>${btn("login", "用 Google 登录")}</p></section>`;
const viewDenied = () => `<div class="head"><h1>${esc(SCHEMA.name)}</h1></div><div class="note">这个账号还没被邀请。请把下面的邮箱告诉所有者。<br><b>${esc(S.me.email)}</b></div><p>${btn("logout", "退出登录", {}, "ghost")}</p>`;

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  if (EXTRA_VIEWS[h] || COLL[h]) return { view: h };
  const coll = collOf(h);
  if (coll) return { view: coll === "cards" ? "board" : coll, coll, id: h };
  return { view: "home" };
}
function render() {
  const r = route(), inside = !!(S.signed && !S.denied);

  document.title = project().name || SCHEMA.name;
  $("#nav").hidden = $("#q").hidden = !inside;
  $(".shell").classList.toggle("solo", !inside);
  const conn = $("#conn"), up = S.live || S.signed === false;
  conn.textContent = up ? "已连接" : S.late ? "连不上数据" : "连接中…";
  conn.className = "chip " + (up ? "live" : S.late ? "warn" : "");

  $("#me-chip").hidden = !$("#me-chip").textContent;
  const sites = SITES.filter((s) => s.id === PID || S.reach.has(s.id));
  $("#sites").hidden = !S.signed || sites.length < 2;

  else if (r.view === "home") html = viewHome();
  else if (r.view === "board") html = viewBoard();
  else if (r.view === "timeline") html = viewTimeline();
  else if (r.view === "settings") html = viewSettings();

  $("#main").innerHTML = html;
  if (typing != null && $("#idea-in")) { $("#idea-in").value = typing; $("#idea-in").focus(); }
}
let queued = false;

  if (queued) return;

}

// ---------- 操作 ----------
// 改状态时要顺手写的那一项（搁置的原因、定下来的结论……）由字段声明的 ask 指定。
function askThenState(coll, id, to, key) {
  const f = COLL[coll].fields.find((x) => x.key === key), d = S.data[coll].get(id);
  openForm({ title: `${titleOf(d)} → ${to}`, defs: [{ ...f, required: true }], values: d, onSave: (v) => write(coll, id, { state: to, ...v }, false) });
}
const ACT = {
  close() { $("#dlg").close(); },
  login() { return BACKEND.signIn().catch((e) => toast(`登录失败（${(e && e.code) || "?"}）`, true)); },
  logout() { return BACKEND.signOut(); },
  async "copy-key"() { try { await navigator.clipboard.writeText(BACKEND.key()); toast("已复制"); } catch { toast("复制失败", true); } },
  async "copy-start"({ id }) { try { await navigator.clipboard.writeText(startText(S.data.cards.get(id), id)); toast("已复制，贴进新会话就能开工"); } catch { toast("复制失败", true); } },
  async "copy-plan"({ id }) { try { await navigator.clipboard.writeText(planText(S.data.cards.get(id), id)); toast("已复制，贴给推理强的智能体"); } catch { toast("复制失败", true); } },
  // 批准计划：计划变成可执行；它的卡如果还没排队，就放进队列等人领。
  async "plan-approve"({ id }) {
    const p = S.data.plans.get(id), card = p.card && S.data.cards.get(p.card);
    if (!(await write("plans", id, { state: "可执行" }, false))) return;
    if (card && ["以后", "等你"].includes(card.state)) await ACT.state({ coll: "cards", id: p.card, to: "排队" });
  },
  "del-ask"(_, el) { if (el.dataset.sure) { openForm.del().then((ok) => ok && $("#dlg").close()); } else { el.dataset.sure = "1"; el.textContent = "确认删除"; el.className = "btn danger mini"; } },
  filt({ coll, k, v }) { setFilt(coll, k, v); schedule(); },
  "more-days"() { S.days += 14; schedule(); },
  new({ coll }) { createDoc(coll, coll === "cards" && S.boardProject ? { project: S.boardProject } : {}); },
  edit({ coll, id }) { editDoc(coll, id); },
  async state({ coll, id, to }) {
    const ask = (stateDef(coll, to) || {}).ask;
    if (ask) return askThenState(coll, id, to, ask);
    const patch = { state: to };
    if (coll === "cards" && to === "完成") patch.done_at = now();
    if (coll === "cards" && to === "排队") await writeSetting("plan", { ...plan(), queue: [...plan().queue.filter((x) => x !== id), id] });
    await write(coll, id, patch, false);
  },
  async "queue-move"({ id, step }) {
    const order = queueCards().map((c) => c.id), i = order.indexOf(id), j = i + Number(step);
    if (i < 0 || j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    await writeSetting("plan", { ...plan(), queue: order });
  },
  "idea-card"({ id }) {
    const d = S.data.ideas.get(id);
    createDoc("cards", { title: d.title, summary: d.outcome || d.body || "", areas: d.areas || [], project: d.project, extra: { idea: id } });
  },
  "issue-card"({ id }) {
    const b = S.data.issues.get(id);
    createDoc("cards", { title: "修：" + b.title, summary: b.detail || "", areas: b.areas || [], paths: b.paths || [] }, (cid) => write("issues", id, { card: cid, state: "处理中" }, false));
  },
  async again({ id }) { await write("mistakes", id, { again: (S.data.mistakes.get(id).again || 0) + 1 }, false); },
  "to-policy"({ id }) {
    const m = S.data.mistakes.get(id);
    createDoc("policies", { title: m.title, body: [m.prevention, m.root_cause && "原因：" + m.root_cause].filter(Boolean).join("\n\n"), areas: m.areas || [] }, (pid) => write("mistakes", id, { policy: pid, state: "已升成方针" }, false));
  },
  async decide({ id, i }) { const d = S.data.decisions.get(id); await write("decisions", id, { state: "已定", choice: d.options[Number(i)].text }, false); },
  answer({ id }) {
    openForm({ title: "回答", defs: [{ key: "text", type: "longtext", required: true, label: "回答" }],
      onSave: (v) => write("questions", id, { state: "已回答", answers: { [newId("a")]: { ...v, by: who(), at: now() } } }, false) });
  },
  resolve({ id }) {
    const q = S.data.questions.get(id);
    openForm({ title: "标为已解决", defs: [{ key: "conclusion", type: "longtext", required: true, label: "结论" }, { key: "keep", type: "bool", label: "把结论留成知识" }], values: { conclusion: q.conclusion, keep: true },
      onSave: async ({ conclusion, keep }) => {
        if (!(await write("questions", id, { state: "已解决", conclusion }, false))) return false;
        if (keep) await write("knowledge", newId("k"), { title: q.title, body: conclusion, areas: q.areas || [], paths: q.paths || [], source: id, state: "待复核" }, true);
        return true;
      } });
  },
  project() { openForm({ title: "中枢设置", defs: SCHEMA.settings.project.fields, values: { areas: SCHEMA.areas, ...project() }, onSave: async (v) => (await writeSetting("project", { ...project(), ...v })) && (toast("已保存"), true) }); },
  profile() {
    const mine = S.data.members.get(S.me.uid) || {};
    openForm({ title: "我的称呼", note: "写在记录的“谁写的”里。", defs: fieldsOf("members", COLL.members.create), values: mine,
      onSave: async (v) => {
        if (!/^[A-Za-z0-9_-]{2,20}$/.test(v.handle)) { toast("2〜20 位半角英数字或 - _", true); return false; }
        try { await S.db.doc("members/" + S.me.uid).set({ ...mine, ...v, updated_at: now() }); toast("已保存"); return true; } catch (e) { toast(`保存失败（${(e && e.code) || "?"}）`, true); return false; }
      } });
  },
  "invite-add"() {
    openForm({ title: "邀请", defs: [{ key: "mail", type: "text", required: true, label: "Google 账号的邮箱" }],
      onSave: async ({ mail }) => {
        const id = mail.toLowerCase();
        if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(id)) { toast("不是邮箱的格式", true); return false; }
        try { await S.db.doc("invites/" + id).set({ at: now() }); toast("已保存"); return true; } catch (e) { toast(`保存失败（${(e && e.code) || "?"}）`, true); return false; }
      } });
  },
  async "invite-del"({ mail }, el) {
    if (!el.dataset.sure) { el.dataset.sure = "1"; el.textContent = "确认移除"; el.className = "btn danger mini"; return; }
    try { await S.db.doc("invites/" + mail).delete(); toast("已移除"); } catch { toast("移除失败", true); }
  },
};
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  ev.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) Promise.resolve(fn({ ...el.dataset }, el)).catch(() => toast("没做成", true));
});
document.addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-change]");
  if (!el) return;
  if (el.dataset.change === "area") setFilt(el.dataset.coll, "area", el.value);
  if (el.dataset.change === "board-project") S.boardProject = el.value;
  if (el.dataset.change === "tl-kind") S.tlKind = el.value;
  schedule();
});
// 想法箱的快速记录：只要一句话，状态是“新想法”，细节以后再补。
document.addEventListener("submit", async (ev) => {
  const form = ev.target.closest('[data-form="idea"]');
  if (!form) return;
  ev.preventDefault();
  const input = $("#idea-in"), title = input.value.trim();
  if (!title) return;
  input.value = "";
  if (!(await write("ideas", newId("i"), { title, state: "新想法" }, true))) input.value = title;
});
$("#q").addEventListener("input", (ev) => { S.q = ev.target.value.trim().toLowerCase(); schedule(); });
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); schedule(); });

// ---------- 连接 ----------
// BACKEND 是页面外面给的小窗口（正式是 Firebase，本机预览是内存里的样本）：
//   db.doc(path) / db.collection(path)、onAuth(cb)、signIn()、signOut()、key()
let BACKEND = null, unsubs = [];
function listen() {
  for (const stop of unsubs) stop();
  unsubs = [];
  for (const key of Object.keys(S.data)) S.data[key] = new Map();
  Object.assign(S, { db: null, live: null, denied: false, invites: new Map(), reach: new Set() });
  Object.assign(S.me, { handle: "", owner: false });
  if (!S.me.uid) return;
  const failed = (e) => { if (e && e.code === "permission-denied") S.denied = true; else S.late = true; schedule(); };
  S.db = { doc: (p) => BACKEND.db.doc(`projects/${PID}/${p}`), collection: (p) => BACKEND.db.collection(`projects/${PID}/${p}`) };
  const uid = S.me.uid;
  // 切换栏只放读得到设置（受邀）的作品。
  for (const s of SITES) if (s.id !== PID) BACKEND.db.doc(`projects/${s.id}/settings/project`).get().then(() => { if (S.me.uid === uid) { S.reach.add(s.id); schedule(); } }, () => {});
  // 所有者是访问规则里写明邮箱的人。hub/owner 只有所有者读得到，读到了就是所有者。
  BACKEND.db.doc("hub/owner").get().then(() => {
    if (S.me.uid !== uid) return;
    S.me.owner = true;
    unsubs.push(S.db.collection("invites").limit(500).onSnapshot((s) => { S.invites = new Map(s.docs.map((d) => [d.id, d.data()])); schedule(); }, () => schedule()));
    schedule();
  }, () => {});
  const sub = (key, query) => unsubs.push(query.onSnapshot((snap) => {
    S.data[key] = new Map(snap.docs.map((d) => [d.id, d.data()]));
    if (key === "members") S.me.handle = (S.data.members.get(S.me.uid) || {}).handle || "";
    if (!snap.metadata.fromCache) S.live = true;
    schedule();
  }, failed));
  sub("settings", S.db.collection("settings"));
  // 工作记录只读最近 400 条，其余在本机镜像里（hq search）。
  for (const c of SCHEMA.collections) sub(c.key, c.key === "sessions" ? S.db.collection(c.key).orderBy("started_at", "desc").limit(400) : S.db.collection(c.key).limit(3000));
}
function connect() {
  BACKEND = window.hubBackend;
  BACKEND.onAuth((user) => {
    S.signed = !!user;
    Object.assign(S.me, { uid: user ? user.uid : null, email: (user && user.email) || "", name: (user && user.name) || "" });
    listen();
    schedule();
  });
}
render();
setTimeout(() => { if (S.signed == null || (S.db && S.live == null && !S.denied)) { S.late = true; schedule(); } }, 10000);
if (window.hubBackend) connect(); else window.addEventListener("hub-backend", connect, { once: true });
})();
</script>
