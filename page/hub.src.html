<title>HIKARI 制作ハブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root {
  /* 貼り紙の作業台：紙の地、太い墨の縁、硬い影。星の黄 = いま・重点、杏 = あなたの確認待ち。左に目次、右に内容。 */
  --paper: #FAF8EE; --paper-2: #F2EFDF; --card: #FFFFFF; --ink: #17160F; --muted: #5E5B4B;
  --rule: #17160F; --shade: #17160F; --star: #F1F977; --apricot: #FFBC7B;
  --bad: #D8453D; --good: #3E8F5C; --soft: #D9D5C2;
  /* 地図：つながりの種類と、メンバーごとの色 */
  --e-include: #3B5BDB; --e-asset: #2B8A3E; --e-component: #D9480F; --e-engine: #868E96;
  --m1: #F59F00; --m2: #7048E8; --m3: #0CA678; --m4: #E64980; --m5: #1C7ED6;
  --display: "Dela Gothic One", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --body: "Noto Sans JP", "Noto Sans SC", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121109; --paper-2: #191811; --card: #1F1E16; --ink: #F3F1E4; --muted: #ADA993; --rule: #57533D; --shade: #000000; --bad: #F06A5E; --good: #6CC48D; --soft: #3A3828; color-scheme: dark;
    --e-include: #748FFC; --e-asset: #69DB7C; --e-component: #FF922B; --e-engine: #ADB5BD; --m1: #FFC078; --m2: #B197FC; --m3: #63E6BE; --m4: #F783AC; --m5: #74C0FC; }
}
:root[data-theme="dark"] { --paper: #121109; --paper-2: #191811; --card: #1F1E16; --ink: #F3F1E4; --muted: #ADA993; --rule: #57533D; --shade: #000000; --bad: #F06A5E; --good: #6CC48D; --soft: #3A3828; color-scheme: dark;
  --e-include: #748FFC; --e-asset: #69DB7C; --e-component: #FF922B; --e-engine: #ADB5BD; --m1: #FFC078; --m2: #B197FC; --m3: #63E6BE; --m4: #F783AC; --m5: #74C0FC; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* #nav などの display より強く：ログイン前・作品を選ぶ画面で目次を隠す */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 20; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--apricot); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }
code { font-family: var(--mono); font-size: .86em; background: var(--paper-2); border: 1.5px solid var(--soft); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }

/* ---------- 上の帯 ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--paper); border-bottom: 2.5px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 17px; text-decoration: none; white-space: nowrap; min-width: 0; }
.brand img { width: 30px; height: 30px; object-fit: contain; transform: rotate(-6deg); }
.chip { font-size: 12px; font-weight: 700; border: 2px solid var(--rule); border-radius: 999px; padding: 0 9px; white-space: nowrap; background: var(--card); }
.chip.live { background: var(--star); color: #17160F; border-color: #17160F; }
.chip.warn { background: var(--apricot); color: #17160F; border-color: #17160F; }
.top .grow { flex: 1 1 140px; min-width: 0; }
.sites { display: flex; flex-wrap: wrap; gap: 4px; }
.sites a { font-size: 12px; font-weight: 700; border: 2px solid var(--soft); border-radius: 999px; padding: 0 9px; white-space: nowrap; text-decoration: none; }
.sites a:hover { border-color: var(--rule); background: var(--card); }
.sites a.on { background: var(--star); color: #17160F; border-color: #17160F; }
#q { width: 100%; max-width: 320px; border: 2px solid var(--rule); border-radius: 999px; background: var(--card); padding: 2px 12px; }

/* ---------- 骨組み ---------- */
.shell { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 18px; padding-block: 16px 40px; align-items: start; }
.shell.solo { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
#nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: flex; flex-direction: column; gap: 3px; }
#nav a { text-decoration: none; font-weight: 700; font-size: 14px; padding: 5px 10px; border-radius: 10px; border: 2px solid transparent; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
#nav a:hover { border-color: var(--rule); background: var(--card); }
#nav a.on { background: var(--star); color: #17160F; border-color: #17160F; box-shadow: 3px 3px 0 var(--shade); }
.badge { font-size: 11px; font-weight: 900; line-height: 1.6; background: var(--apricot); color: #17160F; border: 2px solid #17160F; border-radius: 999px; padding: 0 6px; }
main { min-width: 0; display: grid; gap: 16px; }

h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
h3 { font-size: 16px; margin: 0 0 4px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
.card { background: var(--card); border: 2.5px solid var(--rule); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.card.now { box-shadow: 4px 4px 0 var(--shade); border-color: #17160F; background: linear-gradient(var(--star), var(--star)) left top / 8px 100% no-repeat, var(--card); padding-left: 20px; }
.card.wait { box-shadow: 4px 4px 0 var(--shade); border-color: #17160F; background: linear-gradient(var(--apricot), var(--apricot)) left top / 8px 100% no-repeat, var(--card); padding-left: 20px; }
.note { padding: 10px 14px; border-left: 6px solid var(--apricot); background: var(--paper-2); border-radius: 0 12px 12px 0; }
.empty { color: var(--muted); font-size: 14px; margin: 2px 0; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 7px 0; border-top: 2px solid var(--paper-2); text-decoration: none; }
.row:first-of-type { border-top: 0; }
a.row:hover b { text-decoration: underline; }
.row b { font-weight: 700; overflow-wrap: anywhere; }
.row small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.row .side { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.when { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.st { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.5; border: 2px solid var(--rule); border-radius: 999px; padding: 0 8px; white-space: nowrap; background: var(--card); }
.st.open { background: var(--star); color: #17160F; border-color: #17160F; }
.st.wait { background: var(--apricot); color: #17160F; border-color: #17160F; }
.st.closed { background: var(--paper-2); color: var(--muted); }
.st.bad { background: var(--bad); color: #fff; border-color: #17160F; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border: 1.5px solid var(--soft); border-radius: 6px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.meter { height: 9px; border: 2px solid var(--rule); border-radius: 999px; background: var(--paper-2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--star); }

.btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; line-height: 1.3; padding: 5px 12px; border: 2px solid #17160F; border-radius: 10px; background: var(--apricot); color: #17160F; box-shadow: 2px 2px 0 #17160F; cursor: pointer; }
.btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #17160F; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--rule); box-shadow: none; }
.btn.star { background: var(--star); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.mini { font-size: 12px; padding: 1px 8px; border-radius: 8px; box-shadow: none; }
.btn[disabled] { opacity: .5; cursor: default; }

/* ---------- ボード ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--paper-2); border: 2px solid var(--soft); border-radius: 12px; padding: 8px; min-width: 0; }
.col h2 { margin: 2px 4px 8px; }
.kc { display: block; background: var(--card); border: 2px solid var(--rule); border-radius: 10px; padding: 7px 9px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; text-decoration: none; }
.kc.now { border-color: #17160F; box-shadow: 3px 3px 0 var(--shade); background: linear-gradient(var(--star), var(--star)) left top / 6px 100% no-repeat, var(--card); padding-left: 14px; }
.kc b { display: block; overflow-wrap: anywhere; }
.kc .acts { margin-top: 5px; }

/* ---------- 詳細 ---------- */
.kv { display: grid; grid-template-columns: minmax(84px, min(40%, 220px)) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; font-size: 13px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv ul, .kv ol { margin: 0; padding-left: 1.2em; }
.md { min-width: 0; overflow-wrap: anywhere; }
.md p { margin: 0 0 8px; }
.md h3, .md h4, .md h5 { margin: 12px 0 4px; font-size: 15px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 1.3em; }
.md li + li { margin-top: 2px; }
.md pre { margin: 0 0 8px; background: var(--paper-2); border: 2px solid var(--soft); border-radius: 10px; padding: 8px 10px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
.md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.md .tw { overflow-x: auto; margin: 0 0 8px; }
.md table { border-collapse: collapse; font-size: 13.5px; }
.md th, .md td { border: 1.5px solid var(--soft); padding: 4px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--paper-2); }
.md > :last-child { margin-bottom: 0; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs img { cursor: zoom-in; min-width: 60px; min-height: 40px; background: var(--paper-2); }
.imgs img, .imgs video { max-width: min(100%, 320px); max-height: 240px; border: 2px solid var(--rule); border-radius: 8px; }
.opt { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; padding: 8px 10px; border: 2px solid var(--rule); border-radius: 10px; margin-top: 6px; }
.opt.rec { background: var(--apricot); color: #17160F; border-color: #17160F; }
.opt.chosen { background: var(--star); color: #17160F; border-color: #17160F; }
.opt span { flex: 1 1 200px; min-width: 0; }
.ans { border-top: 2px dashed var(--soft); padding-top: 8px; margin-top: 8px; }

/* ---------- 入力 ---------- */
dialog { width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); border: 2.5px solid #17160F; border-radius: 16px; box-shadow: 7px 7px 0 var(--shade); background: var(--card); color: var(--ink); padding: 0; }
dialog::backdrop { background: rgba(18, 17, 9, .55); }
#dlg-form { display: grid; gap: 12px; padding: 16px 18px; }
.f { display: grid; gap: 3px; }
.f label { font-weight: 700; font-size: 13px; }
.f small { color: var(--muted); font-size: 12px; }
.f input[type="text"], .f input[type="number"], .f select, .f textarea { width: 100%; border: 2px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 5px 10px; }
.f textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
.f textarea.tall { min-height: 220px; font-family: var(--mono); font-size: 13px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.checks label { font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.dlg-foot .left { margin-right: auto; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 6px 14px; font-weight: 700; font-size: 13px; max-width: calc(100vw - 32px); }
#toast.bad { background: var(--bad); color: #fff; }

/* ---------- 絞り込み・日ごと ---------- */
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.bar label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.bar select { border: 2px solid var(--rule); border-radius: 999px; background: var(--card); padding: 1px 10px; font-size: 13px; max-width: 220px; }
.day { display: grid; gap: 6px; }
.day h2 { justify-content: flex-start; margin: 4px 0 0; }
.day h2 b { font-family: var(--mono); font-size: 14px; color: var(--ink); }
.ev small .tag { margin-right: 4px; }

/* ---------- 地図 ---------- */
.branches { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.br { display: grid; gap: 2px; text-align: left; cursor: pointer; background: var(--card); border: 2.5px solid var(--rule); border-left-width: 8px; border-radius: 12px; padding: 8px 10px; min-width: 0; }
.br.on { box-shadow: 4px 4px 0 var(--shade); background: linear-gradient(var(--star), var(--star)) right top / 10px 100% no-repeat, var(--card); }
.br b { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.br small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.br.ghost { border-style: dashed; cursor: default; }
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
.mapwrap > aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100dvh - 90px); overflow: auto; }
.atlas { position: relative; isolation: isolate; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); align-items: start; }
.district { background: var(--paper-2); border: 2px dashed var(--soft); border-radius: 14px; padding: 8px 10px 10px; min-width: 0; }
.district h3 { font-size: 13px; margin: 0 0 6px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.tiles { display: flex; flex-wrap: wrap; gap: 7px; }
.tile { position: relative; z-index: 2; flex: 1 1 96px; min-width: 0; text-align: left; cursor: pointer; background: var(--card); border: 2px solid var(--rule); border-radius: 10px; padding: 4px 8px; font-size: 12.5px; line-height: 1.4; }
.tile b { display: block; overflow-wrap: anywhere; }
.tile small { display: block; color: var(--muted); font-size: 11px; }
.tile.on { background: var(--star); color: #17160F; border-color: #17160F; box-shadow: 3px 3px 0 var(--shade); }
.tile.on small { color: #3F3D30; }
.tile.dim { opacity: .38; }
.tile.hot { border-color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
.tile.new { border-style: dashed; }
.tile.last { outline: 3px solid var(--star); outline-offset: 2px; }
.newest { display: inline-block; font-size: 10px; font-weight: 900; line-height: 1.5; padding: 0 5px; border-radius: 999px; background: var(--star); color: #17160F; border: 1.5px solid #17160F; vertical-align: middle; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 2px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #17160F; display: inline-block; }
#links { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .ln { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 4px; }
.files { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.files li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; padding: 2px 0; border-top: 1px solid var(--paper-2); }
.files code { background: none; border: 0; padding: 0; }
.plus { color: var(--good); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.minus { color: var(--bad); }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 10px; padding-block: 10px 32px; }
  #nav { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  #nav::-webkit-scrollbar { display: none; }
  #nav a { white-space: nowrap; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .mapwrap { grid-template-columns: minmax(0, 1fr); }
  .mapwrap > aside { position: static; max-height: none; }
}

<!--backend-->
<script type="module">
// Firebase（Google ログインと Firestore）を、ページが使う小さな窓口にする。update は入れ子のマップを合わせる（merge）。
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { initializeFirestore, doc, collection, getDoc, setDoc, deleteDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app = initializeApp(JSON.parse(document.getElementById("hub-config").textContent).firebase);
const auth = getAuth(app), store = initializeFirestore(app, { ignoreUndefinedProperties: true });
const snapOf = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
const docRef = (path) => {
  const ref = doc(store, path);
  return { get: async () => snapOf(await getDoc(ref)), set: (d) => setDoc(ref, d), update: (d) => setDoc(ref, d, { merge: true }), delete: () => deleteDoc(ref),
    onSnapshot: (next, fail) => onSnapshot(ref, (s) => next(snapOf(s)), fail) };
};
const collRef = (path, cons = []) => ({
  orderBy: (field, dir) => collRef(path, [...cons, orderBy(field, dir)]), limit: (n) => collRef(path, [...cons, limit(n)]),
  onSnapshot: (next, fail) => onSnapshot(query(collection(store, path), ...cons), (s) => next({ docs: s.docs.map(snapOf), metadata: s.metadata }), fail),
});
window.hubBackend = {
  db: { doc: docRef, collection: collRef },
  onAuth: (cb) => onAuthStateChanged(auth, (u) => cb(u && { uid: u.uid, email: u.email, name: u.displayName })),
  signIn: () => signInWithPopup(auth, new GoogleAuthProvider()),
  signOut: () => signOut(auth),
  // エージェントの鍵：この人のログインを更新するためのトークン。エージェントの hub コマンドがこれで本人として読み書きする。
  key: () => "hhk1." + auth.currentUser.refreshToken,
};
window.dispatchEvent(new Event("hub-backend"));
</script>

const pad = (n) => String(n).padStart(2, "0");
function now() {

function daysTo(date) {

// [見出し, 記録の配列] の並び。日ごとは新しい日から。
function groupRows(rows, how) {

  const key = how === "person" ? (d) => d.by || d.assignee || "—" : (d) => dayOf(d.updated_at || d.at) || "—";
  const groups = new Map();
  for (const d of rows) { const k = key(d); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); }
  const out = [...groups];
  return how === "person" ? out.sort((a, b) => a[0].localeCompare(b[0])) : out.sort((a, b) => b[0].localeCompare(a[0]));
}

// ---------- Markdown（先に全部エスケープしてから、決まった記法だけ戻す） ----------
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const lines = String(text ?? "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flush();
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
    } else if (/^\|.*\|\s*$/.test(line)) {
      flush();
      const rows = [];
      for (; i < lines.length && /^\|.*\|\s*$/.test(lines[i]); i++) rows.push(lines[i].trim().slice(1, -1).split("|").map((c) => c.trim()));
      const head = rows.length > 1 && rows[1].every((c) => /^:?-+:?$/.test(c));
      const body = head ? rows.slice(2) : rows;
      out.push(`<div class="tw"><table>${head ? `<tr>${rows[0].map((c) => `<th>${inline(c)}</th>`).join("")}</tr>` : ""}${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);
    } else if (/^#{1,4}\s/.test(line)) {
      flush();
      const n = Math.min(5, line.match(/^#+/)[0].length + 2);
      out.push(`<h${n}>${inline(line.replace(/^#+\s*/, ""))}</h${n}>`);
      i++;
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+\./.test(line), items = [];
      for (; i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length)); i++) {
        if (/^\s{0,1}([-*]|\d+\.)\s+/.test(lines[i]) || !items.length) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else items[items.length - 1] += "\n" + lines[i].trim().replace(/^([-*]|\d+\.)\s+/, "・");
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((it) => `<li>${it.split("\n").map(inline).join("<br>")}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
    } else if (!line.trim()) { flush(); i++; } else { para.push(line); i++; }
  }
  flush();
  return out.join("");
}

// ---------- 部品 ----------
function stClass(coll, d) {
  if (!COLL[coll].states) return "";
  if (coll === "cards" && d.state === "確認待ち") return "wait";
  if (coll === "decisions" && d.state === "未決定") return "wait";
  if ((coll === "design" && d.state === "下書き") || (coll === "workflows" && d.state === "試してほしい")) return "wait";
  return isOpen(coll, d) ? "open" : "closed";
}
function stPill(coll, d) {
  if (!COLL[coll].states || !d.state) return "";
  const name = coll === "cards" ? stage(d) : d.state, def = stateDef(coll, d.state);
  const label = S.lang === "zh" ? (name === "予定" ? t("ready") : (def && def.zh) || name) : name;
  return `<span class="st ${stClass(coll, d)}">${esc(label)}${d.state === "確認待ち" && d.waiting ? "・" + esc(d.waiting) : ""}</span>`;
}
const tags = (d) => [d.kind, d.severity, d.frequency, ...(d.areas || [])].filter(Boolean).map((x) => `<span class="tag">${esc(x)}</span>`).join(" ");
// 終了した作業の報告で、必ず書く項目が抜けているもの（空の配列は「なし」として書いてあると見なす）。
function gaps(coll, d) {
  const req = COLL[coll].required_when_done;
  if (!req || d.state !== "終了" || d.kind === "日報") return [];
  return req.filter((k) => d[k] == null || (k === "conclusion" && !String(d[k]).trim()));
}
const gapPill = (coll, d) => { const n = gaps(coll, d).length; return n ? `<span class="st bad">${t("gap")} ${n}</span>` : ""; };
// acts：行の右に置くボタン（ホームの「確認待ち」をその場で片づける）。
function row(coll, d, sub, acts = []) {
  return `<a class="row" href="#${esc(d.id)}"><span><b>${esc(titleOf(d))}</b><small>${sub ?? `${byText(d)} ${tags(d)}`}</small></span><span class="side">${stPill(coll, d)}${gapPill(coll, d)}<span class="when">${esc(fmt(d.updated_at || d.at))}</span></span>${acts.length ? `<span class="row-acts">${acts.join("")}</span>` : ""}</a>`;
}
const list = (rows, emptyKey = "none") => (rows.length ? rows.join("") : `<p class="empty">${t(emptyKey)}</p>`);
// tip：ボタンにマウスを置いたときの説明（押すと何が起きるか）。
const btn = (act, label, data = {}, cls = "", tip = "", icon = act === "state" ? STATE_ICON[data.to] : ACT_ICON[act]) =>
  `<button type="button" class="btn ${cls}" data-act="${act}" ${tip ? `title="${esc(tip)}"` : ""} ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${ic(icon)}<span>${esc(label)}</span></button>`;
function toast(text, bad) {
  const el = $("#toast");
  el.textContent = text;
  el.className = bad ? "bad" : "";
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, bad && text.length > 40 ? 9000 : 2600);
}
const matchQ = (d) => !S.q || JSON.stringify(d).toLowerCase().includes(S.q);

// ---------- 書き込み ----------
function stamp(isNew) {
  const at = now();
  return isNew ? { by: S.me.handle, at, updated_at: at, updated_by: S.me.handle } : { updated_at: at, updated_by: S.me.handle };
}
async function write(coll, id, data, isNew) {
  if (!S.db) return false;
  try {
    const ref = S.db.doc(coll + "/" + id);
    if (isNew) await ref.set({ ...data, ...stamp(true) });
    else await ref.update({ ...data, ...stamp(false) });
    toast(t("saved"));
    return true;
  } catch (e) {
    toast(e && e.code === "permission-denied" ? t("denied") : `${t("failed")}（${(e && e.code) || "?"}）`, true);
    return false;
  }
}
// 画像は縮めてデータベースに入れる（無料枠にはファイル置き場が無い。1 枚は約 0.9 MB まで）。
async function uploadImage(file) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) throw new Error(t("uploadFail"));
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  const data = [0.82, 0.6, 0.4].map((q) => cv.toDataURL("image/jpeg", q)).find((d) => d.length < 900000);
  if (!data) throw new Error(t("uploadFail"));
  const id = newId("f");
  await S.db.doc("files/" + id).set({ data, name: file.name, by: S.me.handle, at: now() });
  return id;
}
const IMAGES = new Map();
function loadImages() {
  for (const el of document.querySelectorAll("img[data-file]:not([src])")) {
    const id = el.dataset.file;
    if (!IMAGES.has(id)) IMAGES.set(id, S.db.doc("files/" + id).get().then((s) => (s.exists ? String(s.data().data || "") : "")).catch(() => ""));
    IMAGES.get(id).then((data) => { if (/^data:image\/(jpeg|png|webp);base64,/.test(data)) el.src = data; });
  }
}
async function writePlan(next) {
  try { await S.db.doc("settings/plan").set({ ...next, ...stamp(false) }); return true; } catch (e) { toast(`${t("failed")}（${(e && e.code) || "?"}）`, true); return false; }
}

// ---------- 入力フォーム（項目は schema から作る） ----------
function fieldInput(f, v) {
  const id = "f-" + f.key, help = f.help ? `<small>${esc(f.help)}</small>` : "";
  const label = `<label for="${id}">${esc(L(f))}${f.required ? " *" : ""}</label>`;
  const opts = (arr, cur, emptyOk = true) => (emptyOk ? `<option value=""></option>` : "") + arr.map((o) => `<option value="${esc(o.v ?? o)}" ${String(o.v ?? o) === String(cur ?? "") ? "selected" : ""}>${esc(o.l ?? o)}</option>`).join("");
  let input;
  switch (f.type) {
    case "longtext": input = `<textarea id="${id}" class="${["body", "detail"].includes(f.key) ? "tall" : ""}">${esc(v ?? "")}</textarea>`; break;
    case "list": input = `<textarea id="${id}">${esc((v || []).join("\n"))}</textarea><small>${t("listHelp")}</small>`; break;
    case "options": input = `<textarea id="${id}">${esc((v || []).map((o) => (o.recommended ? "★ " : "") + o.text).join("\n"))}</textarea><small>${t("optHelp")}</small>`; break;
    case "number": input = `<input type="number" step="any" id="${id}" value="${esc(v ?? "")}">`; break;
    case "bool": return `<div class="f"><label class="checks"><span><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(L(f))}</span></label>${help}</div>`;
    case "choice": input = `<select id="${id}">${opts(f.choices, v)}</select>`; break;
    case "state": input = `<select id="${id}">${opts(f.states, v, false)}</select>`; break;
    case "rulecategory": input = `<select id="${id}">${opts(COLL.rules.categories, v)}</select>`; break;
    case "milestone": input = `<select id="${id}">${opts(plan().milestones.map((m) => ({ v: m.id, l: `${m.date} ${m.title}` })), v)}</select>`; break;
    case "member": input = `<select id="${id}">${opts(docs("members").map((m) => m.handle).filter(Boolean), v)}</select>`; break;
    case "areas": input = `<div class="checks" id="${id}">${(project().areas || []).map((a) => `<label><input type="checkbox" value="${esc(a)}" ${(v || []).includes(a) ? "checked" : ""}>${esc(a)}</label>`).join("") || `<span class="muted">—</span>`}</div>`; break;
    case "assets": input = `<input type="file" id="${id}" multiple accept="image/*">`; break;
    default: input = `<input type="text" id="${id}" value="${esc(v ?? "")}" autocomplete="off">`;
  }
  return `<div class="f">${label}${input}${f.type === "list" || f.type === "options" ? "" : help}</div>`;
}
async function fieldValue(f) {
  const el = $("#f-" + f.key);
  if (!el) return undefined;
  const lines = () => el.value.split("\n").map((s) => s.trim()).filter(Boolean);
  switch (f.type) {
    case "list": return lines();
    case "options": return lines().map((s) => ({ text: s.replace(/^[★*]\s*/, ""), recommended: /^[★*]/.test(s) }));
    case "number": return el.value === "" ? null : Number(el.value);
    case "bool": return el.checked;
    case "areas": return [...el.querySelectorAll("input:checked")].map((i) => i.value);
    case "assets": {
      if (!el.files.length) return undefined;
      const ids = [];
      for (const file of el.files) ids.push(await uploadImage(file));
      return ids;
    }
    default: return el.value.trim();
  }
}
// defs: 項目の配列。onSave(values) が true を返したら閉じる。
function openForm({ title, defs, values = {}, onSave, note = "", del, submit = t("save") }) {
  const form = $("#dlg-form");
  form.innerHTML = `<h1>${esc(title)}</h1>${note ? `<p class="muted">${esc(note)}</p>` : ""}${defs.map((f) => fieldInput(f, values[f.key])).join("")}
    <div class="dlg-foot">${del ? `<span class="left">${btn("del-ask", t("del"), {}, "ghost mini")}</span>` : ""}${btn("close", t("cancel"), {}, "ghost")}<button class="btn" type="submit">${esc(submit)}</button></div>`;
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const submit = form.querySelector('[type="submit"]');
    submit.disabled = true;
    try {
      const out = {};
      for (const f of defs) {
        const v = await fieldValue(f);
        if (v === undefined) continue;
        if (f.required && blank(v)) { toast(`${L(f)}：${t("need")}`, true); return; }
        if (f.type === "options" && (v.length < 2 || v.filter((o) => o.recommended).length !== 1)) { toast(t("optBad"), true); return; }
        out[f.key] = v;
      }
      if (await onSave(out)) $("#dlg").close();
    } catch (e) { toast(String((e && e.message) || t("failed")), true); } finally { submit.disabled = false; }
  };
  openForm.del = del;
  $("#dlg").showModal();
}
const fieldsOf = (coll, keys) => keys.map((k) => COLL[coll].fields.find((f) => f.key === k)).filter(Boolean);
function editDefs(coll) {
  const skip = new Set(["time", "log", "answers", "assets"]);
  return COLL[coll].fields.filter((f) => !skip.has(f.type)).map((f) => (f.type === "state" ? { ...f, states: COLL[coll].states.map((s) => s.name) } : f));
}
function createDoc(coll, preset = {}, after) {
  const c = COLL[coll];
  openForm({
    title: `${L(c.label)}：${t("add")}`, note: L(c.summary), defs: fieldsOf(coll, c.create), values: preset,
    onSave: async (v) => {
      const id = preset.id || newId(c.prefix), base = c.states ? { state: c.states[0].name } : {};
      if (coll === "reports") Object.assign(base, { kind: "日報", title: now().slice(0, 10), state: "終了" });
      const ok = await write(coll, id, { ...base, ...preset.extra, ...v }, true);
      if (ok && after) await after(id);
      if (ok && !isOwnerOnly(coll) && !PAGE_COLLS.includes(coll)) location.hash = id;
      return ok;
    },
  });
}
function editDoc(coll, id) {
  const d = S.data[coll].get(id);
  if (!d) return;
  openForm({
    title: `${L(COLL[coll].label)}：${t("edit")}`, defs: editDefs(coll), values: d, onSave: (v) => write(coll, id, v, false),
    del: S.me.owner && PAGE_COLLS.includes(coll) ? async () => { try { await S.db.doc(coll + "/" + id).delete(); toast(t("saved")); location.hash = coll; return true; } catch { toast(t("failed"), true); return false; } } : null,
  });
}

const mine = (who) => (who && who === S.me.handle) || (S.me.owner && (!who || who === "オーナー"));

  const working = cards.filter((c) => c.state === "作業中").map((c) => {
    const r = reports.find((x) => x.card === c.id && x.state === "作業中"), last = r && (r.progress || []).slice(-1)[0];
    return row("cards", c, `${esc(c.assignee || "")}${r && r.by_agent ? " · " + esc(r.by_agent) : ""}${last ? " — " + esc(last.note) : ""}`);
  });
  // 確認待ちは、その場で片づけるボタン付き。
  const rec = (d) => (d.options || []).findIndex((o) => o.recommended);
  const waits = [

// タイムライン：記録を日ごとに並べる。作成で 1 件、報告の進捗は 1 つずつ、状態が別の日に変わったらもう 1 件。
function viewTimeline() {
  const f = filt("timeline"), events = [];
  const kinds = SCHEMA.collections.filter((c) => !["members", "map"].includes(c.key));
  for (const c of kinds) {
    if (f.kind && f.kind !== c.key) continue;
    for (const d of docs(c.key)) {
      if (!passes(d, { ...f, kind: "" })) continue;
      if (d.at) events.push({ at: d.at, coll: c.key, d, what: t("evNew") });
      for (const p of c.key === "reports" ? d.progress || [] : []) if (p.at) events.push({ at: p.at, coll: c.key, d, what: t("evProgress"), note: p.note });
      if (d.updated_at && d.state && dayOf(d.updated_at) !== dayOf(d.at)) events.push({ at: d.updated_at, coll: c.key, d, what: (stateDef(c.key, d.state) && S.lang === "zh" ? stateDef(c.key, d.state).zh : d.state) });
    }
  }
  const days = groupRows(events.sort((a, b) => String(b.at).localeCompare(String(a.at))).map((e) => ({ ...e, updated_at: e.at })), "day");
  const shown = days.slice(0, S.days);
  const ev = (e) => `<a class="row ev" href="#${esc(e.d.id)}"><span><b>${esc(titleOf(e.d))}</b><small><span class="tag">${esc(L(COLL[e.coll].label))}</span>${esc(e.what)}${e.note ? " — " + esc(e.note) : ""} · ${byText(e.d)} ${tags({ areas: areasOf(e.d) })}</small></span><span class="side">${stPill(e.coll, e.d)}<span class="when">${esc(String(e.at).slice(11, 16))}</span></span></a>`;
  return `<div class="head"><h1>${t("timeline")}</h1></div><p class="muted">${t("tlWhy")}</p>
    ${filterBar("timeline", { kinds: kinds.map((c) => ({ v: c.key, l: L(c.label) })) })}
    ${shown.map(([day, evs]) => `<div class="day">${dayHead(day, evs.length)}<section class="card">${evs.map(ev).join("")}</section></div>`).join("") || `<p class="empty">${t("none")}</p>`}
    ${days.length > S.days ? `<p>${btn("more-days", t("more", 14), {}, "ghost")}</p>` : ""}`;
}

// ---------- 地図（hub map が git から作る：ブランチごとの区画・つながり・元ブランチとの違い） ----------
const EDGE_KINDS = [["include", "kInclude"], ["asset", "kAsset"], ["component", "kComponent"], ["engine", "kEngine"]];
// 地図に載せるブランチ：元ブランチ、公開ブランチ、メンバーそれぞれの自分のブランチ。色はメンバーの並び順。
function branchSet() {
  const pr = project(), base = pr.base_branch || "develop", release = pr.release_branch || "main";
  const members = docs("members").filter((m) => m.branch).sort((a, b) => String(a.handle).localeCompare(String(b.handle)));
  const owners = new Map(members.map((m) => [m.branch, m.handle]));
  const color = new Map([[base, "var(--ink)"], [release, "var(--muted)"]]);
  members.forEach((m, i) => { if (!color.has(m.branch)) color.set(m.branch, `var(--m${(i % 5) + 1})`); });
  const names = [...new Set([base, release, ...members.map((m) => m.branch)])];
  const maps = new Map(docs("map").filter((d) => names.includes(d.id)).map((d) => [d.id, d]));
  const personal = names.filter((b) => b !== base && b !== release);
  return { base, release, names, owners, color, maps, personal };
}
function nodeName(id) {
  if (id === "@sdk") return t("sdk");
  if (id.startsWith("@type:")) return id.slice(6).replace(/^HIKARI\./, "");
  if (id === ".") return t("rootFiles");
  if (id.endsWith(".scene.json")) return id.split("/").pop().replace(/\.scene\.json$/, "");
  return id.includes("/") ? id.slice(id.indexOf("/") + 1) : id;
}
const districtOf = (n) => (n.kind === "scene" ? "#scene" : n.id.startsWith("@") ? "#outside" : n.id.split("/")[0]);
const districtName = (k) => (k === "#scene" ? t("scenes") : k === "#outside" ? t("outside") : k === "." ? t("rootFiles") : k);
const kb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
// 選んだブランチ（無ければ全部の和）の区画とつながり、区画ごとに「どのブランチが何を変えているか」。
function mapModel(set) {
  const sel = set.maps.get(S.mapBranch), used = sel ? [sel] : [...set.maps.values()];
  const nodes = new Map(), edges = new Map(), touch = new Map();
  for (const d of used) {
    for (const n of d.nodes || []) if (!nodes.has(n.id)) nodes.set(n.id, n);
    for (const e of d.edges || []) { const k = e.from + "\u0001" + e.to + "\u0001" + e.kind, old = edges.get(k); if (!old || old.n < e.n) edges.set(k, e); }
  }
  for (const d of sel ? [sel] : set.personal.map((b) => set.maps.get(b)).filter(Boolean)) {
    for (const c of d.changed || []) {
      if (!c.node) continue;
      if (!touch.has(c.node)) touch.set(c.node, new Map());
      const per = touch.get(c.node);
      if (!per.has(d.id)) per.set(d.id, []);
      per.get(d.id).push(c);
    }
  }
  const baseIds = new Set(((set.maps.get(set.base) || {}).nodes || []).map((n) => n.id));
  // 最後の変更：選んだブランチのもの。全体なら、いちばん新しいもの。
  const from = sel || used.filter((d) => d.last).sort((a, b) => String(b.last.at).localeCompare(String(a.last.at)))[0];
  const last = from && from.last ? { ...from.last, branch: from.id } : null, lastNodes = new Map();
  for (const c of (last && last.changed) || []) if (c.node) { if (!lastNodes.has(c.node)) lastNodes.set(c.node, []); lastNodes.get(c.node).push(c); }
  return { sel, nodes, edges: [...edges.values()], touch, baseIds, last, lastNodes };
}
// 線を引くときに使う：描いたつながりと、「この変更だけ見る」のときの区画。
let mapEdges = [], mapFocus = null;
function viewMap() {
  const set = branchSet(), m = mapModel(set), sel = m.sel;
  if (S.mapNode && !m.nodes.has(S.mapNode)) S.mapNode = "";
  const latest = [...set.maps.values()].map((d) => d.mapped_at || "").sort().pop();
  const card = (b) => {
    const d = set.maps.get(b), on = S.mapBranch === b, who = set.owners.get(b);
    const role = b === set.base ? t("roleBase") : b === set.release ? t("roleRelease") : t("roleOf", who || "?");
    if (!d) return `<div class="br ghost" style="border-left-color:${set.color.get(b)}"><b>${esc(b)}</b><small>${esc(role)}</small><small>${t("notPushed")}</small></div>`;
    const lines = [];
    if (d.role === "personal" && d.compare) lines.push(`${t("notMerged", d.compare)}：${t("commits", d.ahead || 0)}${d.behind ? ` · ${t("behind", d.compare)} ${d.behind}` : ""}`);
    if (d.role === "base" && d.compare) lines.push(`${t("notReleased", d.compare)}：${t("commits", d.ahead || 0)}`);
    if (d.compare) lines.push(t("changedFiles", d.changed_total || 0));
    const h = d.head || {};
    return `<button type="button" class="br ${on ? "on" : ""}" style="border-left-color:${set.color.get(b)}" data-act="map-branch" data-b="${esc(b)}"><b>${esc(b)}</b><small>${esc(role)}</small>${lines.map((l) => `<small>${esc(l)}</small>`).join("")}<small>${esc(String(h.subject || "").slice(0, 70))}</small><small class="when">${esc(fmt(h.at))} ${esc(h.author || "")}</small></button>`;
  };
  // 同じファイルを 2 つ以上の自分のブランチで変えているもの（ぶつかりそうなところ）。
  const byPath = new Map();
  for (const b of set.personal) for (const c of (set.maps.get(b) || {}).changed || []) { if (!byPath.has(c.path)) byPath.set(c.path, []); byPath.get(c.path).push(b); }
  const clash = [...byPath].filter(([, bs]) => bs.length > 1).sort((a, b) => a[0].localeCompare(b[0]));
  const clashNodes = new Set(clash.map(([p]) => ((set.maps.get(byPath.get(p)[0]) || {}).changed || []).find((c) => c.path === p)?.node).filter(Boolean));
  const dot = (b) => `<i style="background:${set.color.get(b) || "var(--soft)"}" title="${esc(b)}"></i>`;
  const focus = !S.mapNode && S.mapLast && m.last ? new Set(m.lastNodes.keys()) : null;
  const linked = new Set(S.mapNode ? m.edges.filter((e) => e.from === S.mapNode || e.to === S.mapNode).flatMap((e) => [e.from, e.to]) : []);
  const dimmed = (id) => (S.mapNode ? !linked.has(id) && S.mapNode !== id : focus ? !focus.has(id) : false);
  const groups = new Map();
  for (const n of m.nodes.values()) { const k = districtOf(n); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(n); }
  const rank = (k) => (k === "#scene" ? 0 : k === "#outside" ? 3 : k === "." ? 2 : 1);
  const districts = [...groups].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0])).map(([k, ns]) => {
    // 区画の名前は、その地区で共通のフォルダを見出しに回した残り（Source/Runtime/Boss → 見出し Source/Runtime、区画 Boss）。
    const segs = k.startsWith("#") || k === "." ? [] : ns.map((n) => n.id.split("/"));
    const common = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return a.slice(0, i); };
    let prefix = segs.length ? segs.reduce(common) : [];
    if (segs.length === 1) prefix = prefix.slice(0, -1);
    const label = (n) => (segs.length ? n.id.split("/").slice(prefix.length).join("/") || t("direct") : nodeName(n.id));
    const tiles = ns.sort((a, b) => a.id.localeCompare(b.id)).map((n) => {
      const per = m.touch.get(n.id), cls = [S.mapNode === n.id ? "on" : "", dimmed(n.id) ? "dim" : "", !sel && clashNodes.has(n.id) ? "hot" : "", !n.id.startsWith("@") && m.baseIds.size && !m.baseIds.has(n.id) ? "new" : "", m.lastNodes.has(n.id) ? "last" : ""].join(" ");
      const info = n.id.startsWith("@") ? "" : t("fileCount", n.files);
      const changed = per ? [...per.values()].reduce((s, a) => s + a.length, 0) : 0;
      return `<button type="button" class="tile ${cls}" data-act="map-node" data-id="${esc(n.id)}"><b>${esc(label(n))}${m.lastNodes.has(n.id) ? ` <span class="newest">${t("newest")}</span>` : ""}</b><small>${esc(info)}${changed ? ` · ±${changed}` : ""}${per ? `<span class="dots">${[...per.keys()].map(dot).join("")}</span>` : ""}</small></button>`;
    }).join("");
    return `<section class="district"><h3>${esc(prefix.length ? prefix.join("/") : districtName(k))} <span class="muted mono">${t("items", ns.length)}</span></h3><div class="tiles">${tiles}</div></section>`;
  });
  mapEdges = m.edges;
  mapFocus = focus;
  const lc = m.last;
  const lastCard = `<section class="card ${lc ? "now" : ""}"><h2>${t("lastChange")} ${lc ? btn("map-last", S.mapLast ? t("lastAll") : t("lastOnly"), {}, "ghost mini") : ""}</h2>${lc
    ? `<div class="row"><span><b>${esc(lc.subject || "")}</b><small><span class="dots">${dot(lc.branch)}</span> <span class="mono">${esc(lc.branch)}</span> · ${esc(lc.author || "")} · ${t("fileCount", lc.changed_total || 0)} · ${esc([...m.lastNodes.keys()].map(nodeName).join("、"))}</small></span><span class="side"><span class="when">${esc(fmt(lc.at))}</span></span></div>`
    : `<p class="empty">${t("lastNone")}</p>`}</section>`;
  const legend = `<div class="legend">${EDGE_KINDS.map(([k, label]) => `<span><i class="ln" style="border-color:var(--e-${k})"></i>${t(label)}</span>`).join("")}${set.personal.filter((b) => set.maps.has(b)).map((b) => `<span><span class="dots">${dot(b)}</span> ${esc(b)}</span>`).join("")}</div>`;

function mapDetail(set, m) {

  const edgeRow = (e, other) => `<li><span></span><span>${link(other)} <span class="tag" style="border-color:var(--e-${esc(e.kind)})">${t((EDGE_KINDS.find(([k]) => k === e.kind) || ["", e.kind])[1])}</span></span><span class="muted mono">${e.n}</span></li>`;

// 区画の位置は描いたあとにしか分からないので、線は描画のあとに引く。何も選んでいなければ全部を薄く、選んだらその区画の線だけ。
function drawLinks() {
  const box = $("#atlas"), svg = $("#links");
  if (!box || !svg) return;
  const r0 = box.getBoundingClientRect(), pos = new Map();
  for (const el of box.querySelectorAll(".tile")) { const r = el.getBoundingClientRect(); pos.set(el.dataset.id, [r.left - r0.left + r.width / 2, r.top - r0.top + r.height / 2]); }
  svg.setAttribute("width", r0.width);
  svg.setAttribute("height", r0.height);
  svg.setAttribute("viewBox", `0 0 ${r0.width} ${r0.height}`);
  const strong = !!(S.mapNode || mapFocus);
  const shown = S.mapNode ? mapEdges.filter((e) => e.from === S.mapNode || e.to === S.mapNode) : mapFocus ? mapEdges.filter((e) => mapFocus.has(e.from) || mapFocus.has(e.to)) : mapEdges;
  svg.innerHTML = EDGE_KINDS.map(([k]) => `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--e-${k})"/></marker>`).join("") + shown.map((e) => {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) return "";
    const dx = b[0] - a[0], dy = b[1] - a[1], cx = (a[0] + b[0]) / 2 - dy * 0.18, cy = (a[1] + b[1]) / 2 + dx * 0.18;
    const w = 1.2 + Math.min(3.5, Math.log2(1 + e.n)), op = strong ? 0.95 : 0.22;
    return `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}" fill="none" style="stroke:var(--e-${e.kind})" stroke-width="${w.toFixed(1)}" stroke-opacity="${op}" ${e.kind === "engine" ? 'stroke-dasharray="5 4"' : ""} ${strong ? `marker-end="url(#ar-${e.kind})"` : ""}/>`;
  }).join("");
}

function fieldView(coll, f, v, d) {
  switch (f.type) {
    case "longtext": return `<div class="md">${md(v)}</div>`;
    case "list": return `<ul>${v.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`;
    case "areas": return v.map((x) => `<span class="tag">${esc(x)}</span>`).join(" ");
    case "bool": return v ? "✓" : "";
    case "ref": { const rc = collOf(v), rd = rc && S.data[rc].get(v); return `<a href="#${esc(v)}">${esc(rd ? titleOf(rd) : v)}</a>`; }
    case "milestone": { const m = plan().milestones.find((x) => x.id === v); return esc(m ? `${m.date} ${m.title}` : v); }
    case "log": return `<ul>${v.map((x) => `<li><span class="when">${esc(fmt(x.at))}</span> ${esc(x.note)}</li>`).join("")}</ul>`;
    case "assets": return `<div class="imgs">${v.map((id) => `<img data-file="${esc(id)}" data-act="zoom" alt="">`).join("")}</div>`;
    case "time": return esc(fmt(v));
    case "options": {
      const can = d.state === "未決定" && mine(d.decider);
      return v.map((o, i) => `<div class="opt ${d.state === "決定" && d.choice === o.text ? "chosen" : o.recommended && d.state === "未決定" ? "rec" : ""}"><span>${o.recommended ? `<b>${t("recommended")}</b> ` : ""}${inline(o.text)}</span>${can ? btn("decide", t("decide"), { id: d.id, i }, "mini star") : ""}</div>`).join("");
    }
    case "answers": return Object.values(v).sort((a, b) => String(a.at).localeCompare(String(b.at))).map((a) => `<div class="ans"><small class="muted">${byText(a)} · ${esc(fmt(a.at))}</small><div class="md">${md(a.text)}</div>${blank(a.evidence) ? "" : `<ul>${a.evidence.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`}</div>`).join("");
    default: return f.key === "pr" && /^https:\/\//.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v);
  }
}

  answer({ id }) {
    openForm({ title: t("answer"), defs: [{ key: "text", type: "longtext", required: true, ja: "回答", zh: "回答" }, { key: "evidence", type: "list", ja: "根拠", zh: "依据" }],
      onSave: (v) => write("questions", id, { state: "回答あり", answers: { [newId("a")]: { ...v, by: S.me.handle, at: now() } } }, false) });
  },
  resolve({ id }) {
    const q = S.data.questions.get(id);
    openForm({ title: t("resolve"), defs: [{ key: "conclusion", type: "longtext", required: true, ja: "結論", zh: "结论" }, { key: "keep", type: "bool", ja: t("toKnowledge"), zh: t("toKnowledge") }], values: { conclusion: q.conclusion, keep: true },
      onSave: async ({ conclusion, keep }) => {
        if (!(await write("questions", id, { state: "解決", conclusion }, false))) return false;
        if (keep) await write("knowledge", newId("k"), { title: q.title, body: conclusion, areas: q.areas || [], paths: q.paths || [], source: id, state: "要確認" }, true);
        return true;
      } });
  },
  "bug-card"({ id }) {
    const b = S.data.bugs.get(id);
    createDoc("cards", { title: "修正：" + b.title, kind: "修正", summary: [b.where, b.actual].filter(Boolean).join("\n"), areas: b.areas || [], extra: { bug: id } },
      (cid) => write("bugs", id, { card: cid, state: "対応中" }, false));
  },
  adopt({ id }) {
    const p = S.data.proposals.get(id), rule = p.rule && S.data.rules.get(p.rule), rid = p.rule && rule ? p.rule : newId("rule");
    openForm({ title: t("adopt"), defs: fieldsOf("rules", COLL.rules.create), values: rule ? { ...rule, body: p.body } : { title: p.title, category: p.category, body: p.body },
      onSave: async (v) => (await write("rules", rid, v, !rule)) && write("proposals", id, { state: "採用" }, false) });
  },
  reject({ id }) { openForm({ title: t("reject"), defs: [{ key: "reply", type: "longtext", required: true, ja: "返事", zh: "回复" }], onSave: (v) => write("proposals", id, { state: "却下", ...v }, false) }); },
  project() {
    const defs = SCHEMA.settings.project.fields;
    openForm({ title: t("project"), defs, values: project(), onSave: async (v) => { try { await S.db.doc("settings/project").set({ ...project(), ...v, ...stamp(false) }); toast(t("saved")); return true; } catch (e) { toast(`${t("failed")}（${(e && e.code) || "?"}）`, true); return false; } } });
  },
  profile() {
    const mineDoc = S.data.members.get(S.me.uid) || {};
    openForm({ title: mineDoc.handle ? t("profile") : t("register"), note: t("registerWhy"), defs: fieldsOf("members", COLL.members.create), values: mineDoc,
      onSave: async (v) => {
        if (!/^[A-Za-z0-9_-]{2,20}$/.test(v.handle)) { toast(t("handleBad"), true); return false; }
        if (docs("members").some((m) => m.id !== S.me.uid && m.handle === v.handle)) { toast(t("handleTaken"), true); return false; }
        if (!branchOk(v.branch, S.me.uid)) { toast(t("branchBad"), true); return false; }
        try { await S.db.doc("members/" + S.me.uid).set({ ...mineDoc, ...v, updated_at: now() }); S.me.handle = v.handle; toast(t("saved")); schedule(); return true; } catch (e) { toast(`${t("failed")}（${(e && e.code) || "?"}）`, true); return false; }
      } });
  },
};
async function copyText(text, msg = t("copyDone")) {
  if (await hikariCopy(text)) { toast(msg); return true; }
  toast(t("copyFail"), true);
  return false;
}
// 作品目録の 1 件：この人（メール）はこの作品に入れる。招待の一覧と一緒に書き、一緒に消す。
const dirDoc = (mail, pid) => BACKEND.db.doc(`directory/${mail.toLowerCase()}/projects/${pid}`);
// オーナーが新しい作品を作る：設定（schema の既定値）、予定、初期のルールとエンジン知識、オーナー自身の作品目録。
async function createProject(v) {
  const id = v.id.trim().toLowerCase(), repo = v.repo.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/, "").replace(/\/+$/, "");
  if (!/^[a-z0-9_-]{1,40}$/.test(id) || id === "engine") { toast(t("npIdBad"), true); return false; }
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast(t("npRepoBad"), true); return false; }
  const base = `projects/${id}/`;
  if ((await BACKEND.db.doc(base + "settings/project").get()).exists) { toast(t("npExists"), true); return false; }
  toast(t("npMaking"));
  const d = SCHEMA.settings.project.defaults, at = now();
  await BACKEND.db.doc(base + "settings/project").set({ ...d, name: v.name.trim(), repo, skill_source: CONFIG.skill, base_branch: v.base_branch || d.base_branch,
    release_branch: v.release_branch || d.release_branch, areas: v.areas.length ? v.areas : d.areas, updated_at: at });
  await BACKEND.db.doc(base + "settings/plan").set({ ...SCHEMA.settings.plan.defaults });
  await Promise.all(Object.entries(CONFIG.seed).flatMap(([coll, docs]) => Object.entries(docs).map(([docId, data]) => BACKEND.db.doc(`${base}${coll}/${docId}`).set(data))));
  await dirDoc(S.me.email, id).set({ at });
  toast(t("npMade"));
  location.href = `?p=${encodeURIComponent(id)}#members`;
  return true;
}
// 空（未設定）か、半角英数字と . _ - で、公開ブランチでもほかの人のブランチでもない名前。
function branchOk(name, uid) {
  if (!name) return true;
  if (!/^[A-Za-z0-9._-]{1,60}$/.test(name) || name === (project().release_branch || "main")) return false;
  return !docs("members").some((m) => m.id !== uid && m.branch === name);
}
async function movePlan(id, step) {
  const p = plan(), ready = [...p.ready], i = ready.indexOf(id), j = i + step;
  if (i < 0 || j < 0 || j >= ready.length) return;
  [ready[i], ready[j]] = [ready[j], ready[i]];
  await writePlan({ ...p, ready });
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  ev.preventDefault();
  const fn = ACT[el.dataset.act];
  if (fn) Promise.resolve(fn({ ...el.dataset }, el)).catch(() => toast(t("failed"), true));
});
$("#q").addEventListener("input", (ev) => { S.q = ev.target.value.trim().toLowerCase(); schedule(); });
document.addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-filter]");
  if (!el) return;
  filt(el.dataset.filter)[el.dataset.field] = el.value;
  schedule();
});
let resized = 0;
window.addEventListener("resize", () => { clearTimeout(resized); resized = setTimeout(drawLinks, 80); });
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); schedule(); });

// ---------- 接続 ----------
// BACKEND はページの外から渡される小さな窓口（本番は Firebase、手元のプレビューはメモリ上の見本）：
//   db.doc(path) / db.collection(path)、onAuth(cb)、signIn()、signOut()、key()
let BACKEND = null, unsubs = [];
// ログインした人が変わったときに、読み込みをやり直す。
function listen() {
  for (const stop of unsubs) stop();
  unsubs = [];
  for (const key of Object.keys(S.data)) S.data[key] = new Map();
  Object.assign(S, { db: null, live: null, denied: false, invites: new Map(), sites: new Map(), engine: false });
  Object.assign(S.me, { handle: "", owner: false, write: null });
  if (!S.me.uid) return;
  const uid = S.me.uid;
  // 切り替え先：作品目録にあって設定が読める（まだ招待されている）作品と、読めればエンジン中枢。
  const reach = (id, then) => BACKEND.db.doc(`projects/${id}/settings/project`).get().then((s) => { if (S.me.uid === uid) { then(s.data() || {}); schedule(); } }, () => {});
  reach("engine", () => { S.engine = true; });
  unsubs.push(BACKEND.db.collection(`directory/${S.me.email.toLowerCase()}/projects`).onSnapshot((snap) => {
    for (const d of snap.docs) if (!S.sites.has(d.id)) reach(d.id, (pr) => S.sites.set(d.id, { name: pr.name || d.id, repo: pr.repo || "" }));
  }, () => {}));
  const failed = (e) => { if (e && e.code === "permission-denied") S.denied = true; else S.late = true; schedule(); };
  if (PID) S.db = { doc: (p) => BACKEND.db.doc(`projects/${PID}/${p}`), collection: (p) => BACKEND.db.collection(`projects/${PID}/${p}`) };
  // オーナーは、アクセス規則に書いてあるメールの人。hub/owner はオーナーにしか読めないので、読めればオーナー。
  BACKEND.db.doc("hub/owner").get().then(() => {
    if (S.me.uid !== uid) return;
    S.me.owner = true;
    if (S.db) unsubs.push(S.db.collection("invites").limit(500).onSnapshot((s) => { S.invites = new Map(s.docs.map((d) => [d.id, d.data()])); schedule(); }, () => schedule()));
    schedule();
  }, () => {});
  if (!S.db) return;
  const sub = (key, query) => unsubs.push(query.onSnapshot((snap) => {
    S.data[key] = new Map(snap.docs.map((d) => [d.id, d.data()]));
    if (key === "members") S.me.handle = (S.data.members.get(S.me.uid) || {}).handle || "";
    if (!snap.metadata.fromCache) { S.live = true; S.me.write = true; }
    schedule();
  }, failed));
  sub("settings", S.db.collection("settings"));
  for (const c of SCHEMA.collections) sub(c.key, c.key === "reports" ? S.db.collection(c.key).orderBy("at", "desc").limit(300) : S.db.collection(c.key).limit(1000));
}
function connect() {
  BACKEND = window.hubBackend;
  BACKEND.onAuth((user) => {
    S.signed = !!user;
    Object.assign(S.me, { uid: user ? user.uid : null, email: (user && user.email) || "", name: (user && user.name) || "" });
    listen();
    schedule();
  });
}
render();
setTimeout(() => { if (S.signed == null || (S.db && S.live == null && !S.denied)) { S.late = true; schedule(); } }, 10000);
if (window.hubBackend) connect(); else window.addEventListener("hub-backend", connect, { once: true });
})();
</script>
